name: Build APK Final

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.4
          arguments: assembleDebug
          cache-disabled: true

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/TaskManager-v1.1.0-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1.0-debug
          name: TaskManager v1.1.0-debug
          body: |
            ## Floktask v1.1.0 - Product Manager Deliverables
            
            **Changes:**
            - Version bump: 1.0.0 → 1.1.0
            - Finance: Added TRANSFER transaction support
            - Export: Added toAccountId, destinationAmount, destinationCurrency
            - All PM documents added (PRDs, user stories, competitor analysis)
            
            **How to install:**
            1. Download TaskManager-v1.1.0-debug.apk
            2. Open on Android device (7.0+)
            3. Allow installation from unknown sources
          prerelease: true
          files: release/TaskManager-v1.1.0-debug.apk
          fail_on_unmatched_files: false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TaskManager-v1.1.0-debug
          path: release/TaskManager-v1.1.0-debug.apk
          retention-days: 30
