name: Emulator Test

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  emulator-test:
    name: Boot Test (no crash on launch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Run emulator and test launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          script: |
            echo "=== Устанавливаю APK ==="
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            echo "=== Очищаю logcat ==="
            adb logcat -c

            echo "=== Запускаю приложение ==="
            adb shell am start -n com.taskmanager.debug/com.taskmanager.presentation.MainActivity

            echo "=== Жду 10 секунд ==="
            sleep 10

            echo "=== Проверяю краши ==="
            CRASH=$(adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime.*CRASH|E AndroidRuntime" || true)
            if [ -n "$CRASH" ]; then
              echo "=== КРАШ ОБНАРУЖЕН ==="
              echo "$CRASH"
              echo "=== Полный стек ==="
              adb logcat -d | grep -A 30 "FATAL EXCEPTION" || true
              exit 1
            else
              echo "=== КРАШЕЙ НЕТ — приложение запустилось успешно ==="
              echo "=== Проверяю что процесс жив ==="
              adb shell ps | grep taskmanager && echo "ПРОЦЕСС ЖИВ" || echo "ПРОЦЕСС НЕ НАЙДЕН"
            fi

      - name: Upload logcat on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-output
          path: |
            ${{ env.HOME }}/.android/avd/*.avd/outputs/logcat.txt
          if-no-files-found: warn
