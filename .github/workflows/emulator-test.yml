name: Emulator Test

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  emulator-test:
    name: Boot Test (no crash on launch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Run emulator and test launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.taskmanager.debug/com.taskmanager.presentation.MainActivity
            sleep 10
            adb logcat -d > /tmp/full-logcat.txt
            echo "=== Проверка крашей ==="
            if adb logcat -d | grep -qE "FATAL EXCEPTION"; then
              echo "КРАШ ОБНАРУЖЕН"
              adb logcat -d | grep -A 30 "FATAL EXCEPTION"
              exit 1
            fi
            echo "КРАШЕЙ НЕТ"
            adb shell ps | grep taskmanager && echo "ПРОЦЕСС ЖИВ" || echo "ПРОЦЕСС НЕ НАЙДЕН"

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-output
          path: /tmp/full-logcat.txt
          if-no-files-found: warn
