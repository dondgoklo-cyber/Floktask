name: Auto APK Upload to Telegram

# Автоматически загружает APK в Telegram после успешной сборки
# Работает вместе с debug-build.yml

on:
  workflow_run:
    workflows: ["Debug APK Build"]
    types:
      - completed

jobs:
  upload-to-telegram:
    name: Upload APK to Telegram
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Floktask-Debug-APK
          path: apk

      - name: Get commit info
        id: commit
        run: |
          # Получаем информацию о коммите из workflow_run
          RUN_ID=${{ github.event.workflow_run.id }}
          echo "Run ID: $RUN_ID"
          
          # Получаем информацию через GitHub API
          COMMIT_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}")
          
          SHORT_HASH=$(echo "$COMMIT_INFO" | jq -r '.sha[0:7]')
          COMMIT_MSG=$(echo "$COMMIT_INFO" | jq -r '.commit.message | .[0:100]')
          AUTHOR=$(echo "$COMMIT_INFO" | jq -r '.commit.author.name')
          
          echo "short_hash=${SHORT_HASH}" >> $GITHUB_OUTPUT
          echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT
          echo "author=${AUTHOR}" >> $GITHUB_OUTPUT

      - name: Find APK file
        id: apk
        run: |
          APK_FILE=$(find apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::APK file not found!"
            exit 1
          fi
          APK_NAME=$(basename "$APK_FILE")
          echo "file=${APK_FILE}" >> $GITHUB_OUTPUT
          echo "name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload to Telegram (optional)
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        run: |
          # Используем Telegram Bot API для отправки APK
          curl -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "document=@${{ steps.apk.outputs.file }}" \
            -F "caption=📦 Floktask Debug Build #${{ github.run_number }}\n
            \nCommit: ${{ steps.commit.outputs.short_hash }}\nMessage: ${{ steps.commit.outputs.commit_msg }}\n\nDownload: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}" \
            -F "parse_mode=HTML" \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Create GitHub comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const apkPath = '${{ steps.apk.outputs.file }}';
            const apkSize = fs.existsSync(apkPath) ? (fs.statSync(apkPath).size / 1024 / 1024).toFixed(2) + ' MB' : 'unknown';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **APK Build Successful!**\n\n` +
                    `📦 **File:** ${{ steps.apk.outputs.name }}\n` +
                    `📊 **Size:** ${apkSize}\n` +
                    `🔗 **Download:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}\n\n` +
                    `📝 **Commit:** ${{ steps.commit.outputs.short_hash }}\n` +
                    `💬 **Message:** ${{ steps.commit.outputs.commit_msg }}`
            });
