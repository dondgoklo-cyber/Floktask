name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Find and copy APK
        id: find_apk
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || true
          echo "=== Searching in build/outputs ==="
          find app/build/outputs -type f 2>/dev/null || echo "No outputs directory"
          APK_PATH=$(find app/build/outputs -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found after assembleDebug"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          mkdir -p release
          cp "$APK_PATH" release/TaskManager-v1.1.1-debug.apk
          echo "APK size: $(du -h release/TaskManager-v1.1.1-debug.apk | cut -f1)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-debug-apk
          path: release/TaskManager-v1.1.1-debug.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1-ci
          name: TaskManager v1.1.1 (Debug)
          body: |
            ## Floktask v1.1.1 - Smart Task Manager

            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### How to install
            1. Download TaskManager-v1.1.1-debug.apk
            2. Open on Android device (7.0+)
            3. Allow installation from unknown sources
          prerelease: true
          files: release/TaskManager-v1.1.1-debug.apk
          fail_on_unmatched_files: true
