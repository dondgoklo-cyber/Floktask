name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon --console=plain 2>&1 | tee /tmp/build-output.log
          exit ${PIPESTATUS[0]}
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Report build errors
        if: always()
        run: |
          echo "=== COMPILE ERRORS ==="
          grep -iE "^e: |error:|Caused by:|ScriptCompilation|requires|compileSdk" /tmp/build-output.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          echo "=== BUILD FAILED ==="
          grep -iE "FAILED|FAILURE|BUILD FAILED|error:" /tmp/build-output.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          echo "=== LAST 80 LINES ==="
          tail -80 /tmp/build-output.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: /tmp/build-output.log
          retention-days: 7

      - name: Find and rename APK
        if: success()
        run: |
          mkdir -p release
          APK=$(find app/build/outputs -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found!"
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"
          cp "$APK" release/WOLFTASK-v1.3.0.apk

      - name: Upload APK Artifact
#                   
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WOLFTASK-release-apk
          path: release/WOLFTASK-v1.3.0.apk
          retention-days: 30

      - name: Delete old releases
        if: success()
        run: |
          gh release list --json tagName,isPrerelease --limit 50 --jq '.[] | select(.isPrerelease == true) | .tagName' 2>/dev/null | while read -r tag; do
            echo "Deleting prerelease: $tag"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done
          gh release delete v1.2.0 --yes --cleanup-tag 2>/dev/null || true
          gh release delete v1.3.0 --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: WOLFTASK v1.3.0
