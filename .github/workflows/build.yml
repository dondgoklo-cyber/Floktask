name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee /tmp/build-output.log
          exit ${PIPESTATUS[0]}
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Report build errors
        if: failure()
        run: |
          echo "=== COMPILE ERRORS ==="
          grep -E "^e: " /tmp/build-output.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          echo "=== BUILD FAILED ==="
          grep -E "FAILED|FAILURE|BUILD FAILED|error:" /tmp/build-output.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          echo "=== LAST 80 LINES ==="
          tail -80 /tmp/build-output.log

      - name: Find and copy APK
        if: success()
        run: |
          mkdir -p release
          APK=$(find app/build/outputs -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found!"
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"
          cp "$APK" release/TaskManager-v1.1.1-debug.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-debug-apk
          path: release/TaskManager-v1.1.1-debug.apk
          retention-days: 30

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1-ci-${{ github.run_number }}
          name: TaskManager v1.1.1 Debug (CI #${{ github.run_number }})
          body: |
            ## Floktask v1.1.1 Debug Build

            **Build:** CI run #${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            **How to install:**
            1. Download TaskManager-v1.1.1-debug.apk
            2. Open on Android device (7.0+)
            3. Allow installation from unknown sources
          prerelease: true
          files: release/TaskManager-v1.1.1-debug.apk
          fail_on_unmatched_files: true
