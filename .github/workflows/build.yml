name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
          arguments: assembleDebug --stacktrace --no-daemon
          cache-disabled: true
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/TaskManager-v1.1.1-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-v1.1.1-debug
          path: release/TaskManager-v1.1.1-debug.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: TaskManager ${{ github.ref_name }}
          body: |
            ## Floktask ${{ github.ref_name }} - Smart Task Manager
            
            **What's new:**
            - Version bump: 1.1.0 -> 1.1.1
            - Fixed Gradle/AGP compatibility (F-BUILD-001)
            - Added signingConfig for release builds (F-BUILD-002)
            - Fixed versionCode and versionName (F-BUILD-003)
            - Added GitHub Secrets for CI/CD (F-CI-001)
            - Added tests for presentation and data layers (F-TEST-001, F-TEST-002)
            - Removed dead code (parseFinance, WorkConstraints)
            - Security fixes in UserPrefs and AlarmScheduler
            - Replaced LocalHapticManager with DI injection
            - Bug fixes in RussianVoiceParser
            
            **How to install:**
            1. Download TaskManager-v1.1.1-debug.apk
            2. Open on Android device (7.0+)
            3. Allow installation from unknown sources
          prerelease: true
          files: release/TaskManager-v1.1.1-debug.apk
          fail_on_unmatched_files: false
