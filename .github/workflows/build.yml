name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee /tmp/build-output.log
          exit ${{ PIPESTATUS[0] }}
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Report build errors
        if: always()
        run: |
          echo "=== COMPILE ERRORS ==="
          grep -iE "^e: |error:|Caused by:|ScriptCompilation|requires|compileSdk" /tmp/build-output.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          echo "=== BUILD FAILED ==="
          grep -iE "FAILED|FAILURE|BUILD FAILED|error:" /tmp/build-output.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          echo "=== LAST 150 LINES ==="
          tail -150 /tmp/build-output.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: /tmp/build-output.log
          retention-days: 7

      - name: Find and copy APK
        if: success()
        run: |
          mkdir -p release
          APK=$(find app/build/outputs -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found!"
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"
          cp "$APK" release/WOLFTASK-debug.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WOLFTASK-debug-apk
          path: release/WOLFTASK-debug.apk
          retention-days: 30