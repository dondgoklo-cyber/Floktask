name: Android CI

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Provide google-services.json
        shell: bash
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "google-services.json not found; copying redacted example so the google-services plugin does not fail."
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Generate Gradle wrapper (if missing)
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew missing; generating wrapper with installed gradle."
            gradle wrapper --gradle-version 8.4 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskmanager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
