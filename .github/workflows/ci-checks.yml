name: CI Checks

# Проверяет код при коммите PR и коммите в main
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Run tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Check for android.util.Log in all layers
        run: |
          echo "🔍 Checking for android.util.Log usage in all layers..."
          
          # Проверяем domain слой
          DOMAIN_LOG=$(grep -r "import android.util.Log" app/src/main/java/com/taskmanager/domain --include="*.kt" | wc -l)
          # Проверяем data слой
          DATA_LOG=$(grep -r "import android.util.Log" app/src/main/java/com/taskmanager/data --include="*.kt" | wc -l)
          # Проверяем presentation слой
          PRESENTATION_LOG=$(grep -r "import android.util.Log" app/src/main/java/com/taskmanager/presentation --include="*.kt" | wc -l)
          # Проверяем прямые вызовы Log
          DIRECT_LOG=$(grep -r "Log\." app/src/main --include="*.kt" | grep -v "Timber\." | grep -v "logger\." | wc -l)
          
          TOTAL=$((DOMAIN_LOG + DATA_LOG + PRESENTATION_LOG + DIRECT_LOG))
          
          if [ "$TOTAL" -gt 0 ]; then
            echo "❌ Found $TOTAL usages of android.util.Log or direct Log calls"
            echo "Domain layer: $DOMAIN_LOG"
            echo "Data layer: $DATA_LOG"
            echo "Presentation layer: $PRESENTATION_LOG"
            echo "Direct Log calls: $DIRECT_LOG"
            exit 1
          fi
          
          echo "✅ No android.util.Log usage found in any layer"

  build-check:
    name: Verify Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build project
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
        env:
          GRADLE_OPTS: "-Xmx2g"

      - name: Run assembleDebug
        run: ./gradlew assembleDebug --dry-run --stacktrace --no-daemon

  dependency-check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for dependency updates
        run: |
          # Можно доработать скрипт для проверки обновлений зависимостей
          echo "Checking for dependency updates..."
          # Например: ./gradlew dependencyUpdates
