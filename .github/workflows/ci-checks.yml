name: CI Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace --no-daemon --console=plain 2>&1 | tee /tmp/test-output.log
          exit ${PIPESTATUS[0]}
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Report test errors
        if: always()
        run: |
          echo "=== COMPILE ERRORS ==="
          grep -iE "^e: |error:|Caused by:|ScriptCompilation|requires|compileSdk" /tmp/test-output.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          echo "=== FAILED TESTS ==="
          grep -iE "FAILED|FAILURE|BUILD FAILED" /tmp/test-output.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          echo "=== LAST 150 LINES ==="
          tail -150 /tmp/test-output.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          path: /tmp/test-output.log
          retention-days: 7

  build-check:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run assembleDebug
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee /tmp/build-output.log
          exit ${PIPESTATUS[0]}
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Report build errors
        if: always()
        run: |
          echo "=== COMPILE ERRORS ==="
          grep -iE "^e: |error:|Caused by:|ScriptCompilation|requires|compileSdk" /tmp/build-output.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          echo "=== KAPT ERRORS ==="
          grep -iE "kapt|annotation processor|warning.*schema" /tmp/build-output.log | head -20 | while IFS= read -r line; do echo "::warning::$line"; done
          echo "=== BUILD FAILED ==="
          grep -iE "FAILED|FAILURE|BUILD FAILED|error:" /tmp/build-output.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          echo "=== LAST 150 LINES ==="
          tail -150 /tmp/build-output.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: /tmp/build-output.log
          retention-days: 7

      - name: Verify APK exists
        if: success()
        run: |
          APK=$(find app/build/outputs -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found in build outputs"
            exit 1
          fi
          echo "APK found: $APK"
          ls -lh "$APK"

  lint:
    name: Run Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run lintDebug
        run: |
          ./gradlew lintDebug --stacktrace --no-daemon --console=plain 2>&1 | tee /tmp/lint-output.log
          exit ${PIPESTATUS[0]}
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output-log
          path: /tmp/lint-output.log
          retention-days: 7
