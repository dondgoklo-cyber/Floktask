name: CI Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Report failing tests
        if: failure()
        run: |
          find app/build/test-results -name "*.xml" -exec grep -l "failures" {} \; 2>/dev/null || true
          find app/build/reports/tests -name "index.html" 2>/dev/null || true

      - name: Check for android.util.Log in all layers
        run: |
          DOMAIN=$(grep -r "import android.util.Log" app/src/main/java/com/taskmanager/domain --include="*.kt" | wc -l)
          DATA=$(grep -r "import android.util.Log" app/src/main/java/com/taskmanager/data --include="*.kt" --exclude-dir="logger" | wc -l)
          PRESENTATION=$(grep -r "import android.util.Log" app/src/main/java/com/taskmanager/presentation --include="*.kt" | wc -l)
          TOTAL=$((DOMAIN + DATA + PRESENTATION))
          if [ "$TOTAL" -gt 0 ]; then
            echo "Found $TOTAL usages of android.util.Log"
            exit 1
          fi
          echo "No android.util.Log usage found"

  build-check:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run assembleDebug
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Verify APK exists
        run: |
          find app/build/outputs -name "*.apk" -type f || echo "WARNING: No APK found"

  dependency-check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Check for dependency updates
        run: |
          echo "Checking for dependency updates..."
          # TODO: uncomment when dependencyUpdates plugin is configured
          # ./gradlew dependencyUpdates
