name: CI Checks

# Проверяет код при коммите PR и коммите в main
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Run tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Check for android.util.Log in all layers
        run: |
          echo "🔍 Checking for android.util.Log usage in all layers..."
          
          # Проверяем импорты
          DOMAIN_IMPORT=$(grep -r "import android.util.Log" app/src/main/java/com/taskmanager/domain --include="*.kt" | wc -l)
          DATA_IMPORT=$(grep -r "import android.util.Log" app/src/main/java/com/taskmanager/data --include="*.kt" | wc -l)
          PRESENTATION_IMPORT=$(grep -r "import android.util.Log" app/src/main/java/com/taskmanager/presentation --include="*.kt" | wc -l)
          
          # Проверяем прямые вызовы Log.d, Log.e, Log.i, Log.w, Log.v
          DOMAIN_DIRECT=$(grep -rE "Log\.(d|e|i|w|v|wtf)" app/src/main/java/com/taskmanager/domain --include="*.kt" | wc -l)
          DATA_DIRECT=$(grep -rE "Log\.(d|e|i|w|v|wtf)" app/src/main/java/com/taskmanager/data --include="*.kt" | wc -l)
          PRESENTATION_DIRECT=$(grep -rE "Log\.(d|e|i|w|v|wtf)" app/src/main/java/com/taskmanager/presentation --include="*.kt" | wc -l)
          
          TOTAL=$((DOMAIN_IMPORT + DATA_IMPORT + PRESENTATION_IMPORT + DOMAIN_DIRECT + DATA_DIRECT + PRESENTATION_DIRECT))
          
          if [ "$TOTAL" -gt 0 ]; then
            echo "❌ Found $TOTAL usages of android.util.Log or direct Log calls"
            echo "Domain layer import: $DOMAIN_IMPORT, direct: $DOMAIN_DIRECT"
            echo "Data layer import: $DATA_IMPORT, direct: $DATA_DIRECT"
            echo "Presentation layer import: $PRESENTATION_IMPORT, direct: $PRESENTATION_DIRECT"
            exit 1
          fi
          
          echo "✅ No android.util.Log usage found in any layer"

  build-check:
    name: Verify Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build project
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
        env:
          GRADLE_OPTS: "-Xmx2g"

      - name: Run assembleDebug
        run: ./gradlew assembleDebug --dry-run --stacktrace --no-daemon

  dependency-check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for dependency updates
        run: |
          echo "Checking for dependency updates..."
          # Напримере: ./gradlew dependencyUpdates
