name: CI Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon --console=plain
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Report failures
        if: failure()
        run: |
          echo "::error::Unit tests failed. Check workflow logs for details."

  build-check:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run assembleDebug
        run: ./gradlew assembleDebug --stacktrace --no-daemon --console=plain
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Verify APK exists
        run: |
          APK=$(find app/build/outputs -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found in build outputs"
            exit 1
          fi
          echo "APK found: $APK"
          ls -lh "$APK"

  dependency-check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Check for dependency updates
        run: |
          echo "Checking for dependency updates..."
          # TODO: uncomment when dependencyUpdates plugin is configured
          # ./gradlew dependencyUpdates
