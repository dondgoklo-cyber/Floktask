name: CI Checks

# Проверяет код при каждом PR и коммите в main
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run tests
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: testDebugUnitTest --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

  build-check:
    name: Verify Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build project
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug --dry-run --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"

  dependency-check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for dependency updates
        run: |
          # Можно добавить скрипт для проверки обновлений зависимостей в gradle файлах
          echo "Checking for dependency updates..."
          # Например: ./gradlew dependencyUpdates
