  gradient_1:
    start: "#FF7A00"
    end: "#FF8C00"
  gradient_2:
    start: "#FF9800"
    end: "#FFB74D"
  gradient_3:
    start: "#4CAF50"
    end: "#81C784"
  subtle_background: "#FFF3E0"
  subtle_background_dark: "#2A1800"

